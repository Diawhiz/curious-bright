{% extends 'base.html' %}
{% load static %}

{% block title %}Curious, But Not Allowed — CuriousBright{% endblock %}

{% block content %}
<section class="error-page error-403">
    <div class="error-code-bg">403</div>
    <div class="error-content">
        <div class="error-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h1 class="error-title">Curious, But Not Allowed</h1>
        <p class="error-message">You've wandered into restricted territory. This area requires permission to explore.</p>
        <div class="error-actions">
            <a href="{% url 'home' %}" class="btn btn-primary error-btn">Go Home</a>
        </div>
    </div>
</section>

<style>
.error-page {
    min-height: calc(100vh - 70px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 2rem;
    background: var(--bg-main);
}

.error-code-bg {
    position: absolute;
    font-size: clamp(15rem, 35vw, 30rem);
    font-weight: 900;
    color: var(--primary);
    opacity: 0.06;
    user-select: none;
    pointer-events: none;
    z-index: 0;
    animation: float 5s ease-in-out infinite;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0.06;
    }
    25% {
        transform: translateY(-15px) translateX(10px);
        opacity: 0.08;
    }
    50% {
        transform: translateY(-5px) translateX(-5px);
        opacity: 0.05;
    }
    75% {
        transform: translateY(-20px) translateX(5px);
        opacity: 0.09;
    }
}

.error-content {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 600px;
    animation: fadeSlideUp 0.8s ease-out;
}

@keyframes fadeSlideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.error-icon {
    font-size: 4rem;
    color: var(--primary);
    margin-bottom: 1.5rem;
    animation: shake 3s ease-in-out infinite;
}

@keyframes shake {
    0%, 100% {
        transform: rotate(0deg);
    }
    10% {
        transform: rotate(-5deg);
    }
    20% {
        transform: rotate(5deg);
    }
    30% {
        transform: rotate(-3deg);
    }
    40% {
        transform: rotate(3deg);
    }
    50% {
        transform: rotate(0deg);
    }
}

.error-title {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 800;
    color: var(--text-heading);
    margin-bottom: 1.5rem;
    letter-spacing: -0.02em;
}

.error-message {
    font-size: 1.2rem;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 2.5rem;
}

.error-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
}

.error-btn {
    padding: 1rem 2.5rem;
    font-size: 1rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.error-btn:hover {
    animation: gentleBounce 0.5s ease;
}

@keyframes gentleBounce {
    0%, 100% {
        transform: translateY(0);
    }
    40% {
        transform: translateY(-4px);
    }
    60% {
        transform: translateY(-2px);
    }
}

@media (max-width: 768px) {
    .error-page {
        min-height: calc(100vh - 60px);
        padding: 1.5rem;
    }
    
    .error-icon {
        font-size: 3rem;
    }
    
    .error-btn {
        width: 100%;
        max-width: 280px;
    }
    
    .error-message {
        font-size: 1.1rem;
    }
}
</style>
{% endblock %}
