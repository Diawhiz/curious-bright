{% extends 'admin/change_form.html' %}

{% block after_related_objects %}

<!-- TipTap Styles -->
<style>
  .tiptap-wrapper {
    border: 1px solid #dee2e6;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 1rem;
    background: white;
  }

  .tiptap-menubar {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 10px 12px;
    background: #f8f9fa;
    border-bottom: 1px solid #dee2e6;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .tiptap-menubar button {
    padding: 6px 10px;
    border: 1px solid #dee2e6;
    border-radius: 5px;
    background: white;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: #333;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .tiptap-menubar button:hover {
    background: #F97316;
    color: white;
    border-color: #F97316;
  }

  .tiptap-menubar button.is-active {
    background: #F97316;
    color: white;
    border-color: #EA580C;
  }

  .tiptap-menubar .separator {
    width: 1px;
    background: #dee2e6;
    margin: 0 4px;
    align-self: stretch;
  }

  .tiptap-menubar select {
    padding: 6px 8px;
    border: 1px solid #dee2e6;
    border-radius: 5px;
    background: white;
    font-size: 13px;
    cursor: pointer;
    color: #333;
  }

  .ProseMirror {
    min-height: 500px;
    padding: 24px 32px;
    outline: none;
    font-size: 16px;
    line-height: 1.8;
    color: #1a1a1a;
    font-family: 'Inter', -apple-system, sans-serif;
  }

  .ProseMirror p { margin-bottom: 1rem; }
  .ProseMirror h1 { font-size: 2rem; font-weight: 800; margin: 1.5rem 0 1rem; }
  .ProseMirror h2 { font-size: 1.6rem; font-weight: 700; margin: 1.5rem 0 1rem; }
  .ProseMirror h3 { font-size: 1.3rem; font-weight: 600; margin: 1.2rem 0 0.8rem; }
  .ProseMirror ul, .ProseMirror ol { padding-left: 1.5rem; margin-bottom: 1rem; }
  .ProseMirror li { margin-bottom: 0.4rem; }
  .ProseMirror blockquote {
    border-left: 4px solid #F97316;
    padding: 0.5rem 1rem;
    margin: 1rem 0;
    background: #FFF7ED;
    color: #555;
    border-radius: 0 8px 8px 0;
  }
  .ProseMirror code {
    background: #f1f5f9;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
    font-family: monospace;
  }
  .ProseMirror pre {
    background: #1e293b;
    color: #e2e8f0;
    padding: 1rem 1.5rem;
    border-radius: 8px;
    overflow-x: auto;
    margin-bottom: 1rem;
  }
  .ProseMirror pre code { background: none; color: inherit; padding: 0; }
  .ProseMirror a { color: #F97316; text-decoration: underline; }
  .ProseMirror img { max-width: 100%; border-radius: 8px; margin: 1rem 0; }
  .ProseMirror hr { border: none; border-top: 2px solid #e2e8f0; margin: 2rem 0; }
  .ProseMirror p.is-editor-empty:first-child::before {
    content: attr(data-placeholder);
    color: #aaa;
    pointer-events: none;
    float: left;
    height: 0;
  }

  /* Word count bar */
  .tiptap-footer {
    padding: 8px 16px;
    background: #f8f9fa;
    border-top: 1px solid #dee2e6;
    font-size: 12px;
    color: #666;
    display: flex;
    justify-content: space-between;
  }

  /* Hide the original textarea */
  #id_content { display: none !important; }
</style>

{% endblock %}

{% block content %}
{{ block.super }}

<script src="https://unpkg.com/@tiptap/core@2.1.12/dist/index.umd.js"></script>
<script src="https://unpkg.com/@tiptap/starter-kit@2.1.12/dist/index.umd.js"></script>
<script src="https://unpkg.com/@tiptap/extension-placeholder@2.1.12/dist/index.umd.js"></script>
<script src="https://unpkg.com/@tiptap/extension-underline@2.1.12/dist/index.umd.js"></script>
<script src="https://unpkg.com/@tiptap/extension-link@2.1.12/dist/index.umd.js"></script>
<script src="https://unpkg.com/@tiptap/extension-image@2.1.12/dist/index.umd.js"></script>
<script src="https://unpkg.com/@tiptap/extension-text-align@2.1.12/dist/index.umd.js"></script>
<script src="https://unpkg.com/@tiptap/extension-color@2.1.12/dist/index.umd.js"></script>
<script src="https://unpkg.com/@tiptap/extension-text-style@2.1.12/dist/index.umd.js"></script>
<script src="https://unpkg.com/@tiptap/extension-character-count@2.1.12/dist/index.umd.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const textarea = document.getElementById('id_content');
  if (!textarea) return;

  // Build the editor wrapper
  const wrapper = document.createElement('div');
  wrapper.className = 'tiptap-wrapper';

  // Toolbar
  wrapper.innerHTML = `
    <div class="tiptap-menubar" id="tiptap-toolbar">
      <select id="heading-select">
        <option value="0">Paragraph</option>
        <option value="1">Heading 1</option>
        <option value="2">Heading 2</option>
        <option value="3">Heading 3</option>
      </select>
      <div class="separator"></div>
      <button type="button" id="btn-bold" title="Bold"><b>B</b></button>
      <button type="button" id="btn-italic" title="Italic"><i>I</i></button>
      <button type="button" id="btn-underline" title="Underline"><u>U</u></button>
      <button type="button" id="btn-strike" title="Strikethrough"><s>S</s></button>
      <div class="separator"></div>
      <button type="button" id="btn-bullet" title="Bullet List">• List</button>
      <button type="button" id="btn-ordered" title="Ordered List">1. List</button>
      <div class="separator"></div>
      <button type="button" id="btn-blockquote" title="Blockquote">" Quote</button>
      <button type="button" id="btn-code" title="Code Block">&lt;/&gt; Code</button>
      <div class="separator"></div>
      <button type="button" id="btn-align-left" title="Align Left">⬅</button>
      <button type="button" id="btn-align-center" title="Align Center">☰</button>
      <button type="button" id="btn-align-right" title="Align Right">➡</button>
      <div class="separator"></div>
      <button type="button" id="btn-link" title="Insert Link">🔗 Link</button>
      <button type="button" id="btn-image" title="Insert Image">🖼 Image</button>
      <button type="button" id="btn-hr" title="Divider">— HR</button>
      <div class="separator"></div>
      <button type="button" id="btn-undo" title="Undo">↩ Undo</button>
      <button type="button" id="btn-redo" title="Redo">↪ Redo</button>
    </div>
    <div id="tiptap-editor-mount"></div>
    <div class="tiptap-footer">
      <span id="word-count">0 words</span>
      <span id="char-count">0 characters</span>
    </div>
  `;

  textarea.parentNode.insertBefore(wrapper, textarea);

  // Initialize TipTap
  const editor = new window.TiptapCore.Editor({
    element: document.getElementById('tiptap-editor-mount'),
    extensions: [
      window.TiptapStarterKit.StarterKit,
      window.TiptapExtensionPlaceholder.Placeholder.configure({
        placeholder: 'Start writing your story here...',
      }),
      window.TiptapExtensionUnderline.Underline,
      window.TiptapExtensionLink.Link.configure({ openOnClick: false }),
      window.TiptapExtensionImage.Image,
      window.TiptapExtensionTextAlign.TextAlign.configure({
        types: ['heading', 'paragraph'],
      }),
      window.TiptapExtensionTextStyle.TextStyle,
      window.TiptapExtensionColor.Color,
    ],
    content: textarea.value || '',
    onUpdate({ editor }) {
      textarea.value = editor.getHTML();
      // Update word/char count
      const text = editor.getText();
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      document.getElementById('word-count').textContent = words + ' words';
      document.getElementById('char-count').textContent = text.length + ' characters';
    },
  });

  // Toolbar button handlers
  document.getElementById('btn-bold').onclick = () => editor.chain().focus().toggleBold().run();
  document.getElementById('btn-italic').onclick = () => editor.chain().focus().toggleItalic().run();
  document.getElementById('btn-underline').onclick = () => editor.chain().focus().toggleUnderline().run();
  document.getElementById('btn-strike').onclick = () => editor.chain().focus().toggleStrike().run();
  document.getElementById('btn-bullet').onclick = () => editor.chain().focus().toggleBulletList().run();
  document.getElementById('btn-ordered').onclick = () => editor.chain().focus().toggleOrderedList().run();
  document.getElementById('btn-blockquote').onclick = () => editor.chain().focus().toggleBlockquote().run();
  document.getElementById('btn-code').onclick = () => editor.chain().focus().toggleCodeBlock().run();
  document.getElementById('btn-align-left').onclick = () => editor.chain().focus().setTextAlign('left').run();
  document.getElementById('btn-align-center').onclick = () => editor.chain().focus().setTextAlign('center').run();
  document.getElementById('btn-align-right').onclick = () => editor.chain().focus().setTextAlign('right').run();
  document.getElementById('btn-hr').onclick = () => editor.chain().focus().setHorizontalRule().run();
  document.getElementById('btn-undo').onclick = () => editor.chain().focus().undo().run();
  document.getElementById('btn-redo').onclick = () => editor.chain().focus().redo().run();

  document.getElementById('btn-link').onclick = () => {
    const url = prompt('Enter URL:');
    if (url) editor.chain().focus().setLink({ href: url }).run();
  };

  document.getElementById('btn-image').onclick = () => {
    const url = prompt('Enter image URL:');
    if (url) editor.chain().focus().setImage({ src: url }).run();
  };

  document.getElementById('heading-select').onchange = function() {
    const level = parseInt(this.value);
    if (level === 0) {
      editor.chain().focus().setParagraph().run();
    } else {
      editor.chain().focus().toggleHeading({ level }).run();
    }
  };

  // Sync before form submit
  const form = document.querySelector('form');
  form.addEventListener('submit', function() {
    textarea.value = editor.getHTML();
  });
});
</script>
{% endblock %}
