{% extends "base.html" %}
{% load static %}

{% block title %}Login Cancelled - CuriousBright{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gradient-to-br from-purple-50 to-indigo-50">
    <div class="max-w-md w-full space-y-8 bg-white rounded-2xl shadow-xl p-8 text-center">
        <div class="mx-auto h-16 w-16 bg-yellow-100 rounded-full flex items-center justify-center">
            <i class="fas fa-exclamation-triangle text-yellow-600 text-2xl"></i>
        </div>

        <h2 class="text-3xl font-extrabold text-gray-900">
            Login Cancelled
        </h2>

        <p class="text-gray-600">
            You cancelled the Google login process. No worries, you can try again anytime.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 justify-center mt-6">
            <a href="{% url 'account_login' %}"
               class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition">
                Try Again
            </a>
            <a href="{% url 'home' %}"
               class="border-2 border-purple-600 text-purple-600 px-6 py-2 rounded-lg hover:bg-purple-50 transition">
                Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
