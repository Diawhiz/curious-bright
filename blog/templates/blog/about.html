{% extends 'base.html' %}

{% block title %}{{ page.title }} - CuriousBright{% endblock %}
{% block meta_description %}{{ page.meta_description }}{% endblock %}

{% block content %}
<article class="static-page-container">
    <header class="page-header">
        <div class="container">
            <h1 class="page-title">{{ page.title }}</h1>
            <p class="last-updated">Last updated: {{ page.updated_date|date:"F d, Y" }}</p>
        </div>
    </header>

    <div class="container">
        <div class="prose-content" style="max-width: 780px; margin: 0 auto;">
            {{ page.content|safe }}
        </div>
    </div>
</article>
{% endblock %}
