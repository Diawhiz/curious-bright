services:
  - type: web
    name: curious-bright-backend
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod=false; pnpm --filter @curious-bright/database run generate; pnpm --filter @curious-bright/database run db:push; pnpm --filter backend run build
    startCommand: node apps/backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://curiousbright.com.ng,https://app.curiousbright.com.ng,https://org.curiousbright.com.ng
