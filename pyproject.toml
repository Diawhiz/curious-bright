[project]
name = "curiousbright"
version = "1.0.0"
description = "CuriousBright - A modern news blog"
requires-python = ">=3.12"
dependencies = [
    "Django==5.1.4",
    "whitenoise==6.7.0",
    "dj-database-url==2.2.0",
    "psycopg2-binary==2.9.10",
    "cloudinary==1.41.0",
    "django-cloudinary-storage==0.3.0",
    "django-quill-editor==0.1.42",
    "django-allauth[socialaccount]==65.2.0",
    "python-dotenv==1.0.1",
    "Pillow==10.4.0",
    "gunicorn==22.0.0",
    "django-jazzmin==3.0.1",
    "PyJWT==2.9.0",
    "cryptography==43.0.3",
    "tweepy==4.16.0",
]

[tool.setuptools.packages.find]
include = ["curiousbright*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
